name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Package draft release
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - name: Check web extension bundles
        run: npm run check

      - name: Generate and build unsigned Safari native project
        run: npm run safari:native-build

      - name: Confirm the tag matches both manifest versions
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          chrome_version=$(node -p "require('./dist/manifest.json').version")
          safari_version=$(node -p "require('./dist-safari/manifest.json').version")
          if [ "$tag" != "v$chrome_version" ] || [ "$tag" != "v$safari_version" ]; then
            echo "Tag $tag does not match Chrome $chrome_version and Safari $safari_version." >&2
            echo "Update package.json and public/manifest.json, then retag." >&2
            exit 1
          fi

      - name: Zip Chrome and Safari resources separately
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          (cd dist && zip -r "../awesomer-lists-${tag}-chrome.zip" .)
          (cd dist-safari && zip -r "../awesomer-lists-${tag}-safari-web-extension.zip" .)
          (cd safari/generated && zip -r "../../awesomer-lists-${tag}-safari-xcode-project.zip" .)

      - name: Publish the draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: awesomer-lists-*.zip
          body: |
            Chrome: unzip the Chrome archive, then load its folder through **Load unpacked** at `chrome://extensions` with Developer mode on.

            Safari: Safari versions that offer **Add Temporary Extension** can load the web extension archive directly. For other supported versions, use the packaged Xcode app. The Xcode project archive is unsigned; signing and App Store submission are separate release-owner steps.

            See CHANGELOG.md for what changed.
