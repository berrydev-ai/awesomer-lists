name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - name: Check before publishing
        run: npm run check

      - name: Confirm the tag matches the manifest version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          manifest_version=$(node -p "require('./dist/manifest.json').version")
          if [ "$tag" != "v$manifest_version" ]; then
            echo "Tag $tag does not match manifest version $manifest_version." >&2
            echo "Update package.json and public/manifest.json, then retag." >&2
            exit 1
          fi

      - name: Zip the unpacked extension
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          cd dist
          zip -r "../awesomer-lists-${tag}.zip" .

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: awesomer-lists-*.zip
          body: |
            Install by downloading the zip, unzipping it, then loading the
            folder through **Load unpacked** at `chrome://extensions` with
            Developer mode on.

            See CHANGELOG.md for what changed.
