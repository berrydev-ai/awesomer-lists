<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Awesomer Lists UI Preview</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #080a10;
        color: #d8dce8;
        font: 14px system-ui, sans-serif;
      }
      .preview-note {
        max-width: 560px;
        margin: 40px auto;
        padding: 20px;
        text-align: center;
      }
      button {
        padding: 9px 14px;
        border: 1px solid #6574c8;
        border-radius: 8px;
        background: #4053b9;
        color: white;
        cursor: pointer;
        font: 600 13px system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="preview-note">
      <p>The preview uses local UI fixtures and does not contact GitHub.</p>
      <button id="open-preview-button" type="button">Open UI preview</button>
    </div>
    <script src="preview.js"></script>
  </body>
</html>
